services:
  postgres:
    image: postgres:17

    container_name: ec-api-db

    environment:
      POSTGRES_DB: ec-api-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ec-api-db" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: